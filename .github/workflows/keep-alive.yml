name: keep-alive

on:
  schedule:
    - cron: '0 12 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Despertar Supabase
        run: >
          curl -s -X POST
          'https://xsijdfaxvdqbtrdqovij.supabase.co/rest/v1/rpc/get_total_confirmados'
          -H "apikey: ${{ secrets.SUPABASE_KEY }}"
          -H "Content-Type: application/json"
          -d '{}'